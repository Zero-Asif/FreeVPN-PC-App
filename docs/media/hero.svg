<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420"
     role="img" aria-labelledby="t d" font-family="'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif">
<title id="t">FreeProxy VPN</title>
<desc id="d">Tor-powered privacy for Windows: country-accurate exits, real geolocation
spoofing, DNS and IPv6 leak protection, and a kill switch that blocks.</desc>
<!--
  docs/media/hero.svg : hand-authored, self-hosted, no network.
  Every animation is SMIL inside the file, which GitHub's sanitiser keeps
  (it strips script elements, not animate ones). Nothing here is fetched: no
  web font, no external gradient, no third-party badge service. That matters
  for this project specifically, because the page it heads claims the app
  opens no address but 127.0.0.1, and a banner phoning a CDN would be the
  first sentence of the README contradicting itself.
  Note for editors: XML forbids a double hyphen inside a comment. The probe
  that renders this file catches it, which is how this note came to be here.
-->
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0b0d17"/><stop offset=".55" stop-color="#120f26"/>
    <stop offset="1" stop-color="#0b0d17"/>
  </linearGradient>
  <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#a78bfa"/><stop offset=".5" stop-color="#e879f9"/>
    <stop offset="1" stop-color="#a78bfa"/>
  </linearGradient>
  <!-- the sweep that walks across the wordmark, once every 6 s -->
  <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#fff" stop-opacity="0"/>
    <stop offset=".5" stop-color="#fff" stop-opacity=".85"/>
    <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    <animate attributeName="x1" values="-.6;1" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="-.2;1.4" dur="6s" repeatCount="indefinite"/>
  </linearGradient>
  <radialGradient id="glowA" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#6b21a8" stop-opacity=".55"/>
    <stop offset="1" stop-color="#6b21a8" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glowB" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#a21566" stop-opacity=".5"/>
    <stop offset="1" stop-color="#a21566" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="wire" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#22d3ee"/>
  </linearGradient>
  <clipPath id="frame"><rect width="1280" height="420" rx="18"/></clipPath>
  <path id="hop" d="M330 356 H1210" fill="none"/>
  <!--  The circuit is one horizontal line, so its bounding box has no height,
        and a gradient in the default objectBoundingBox units cannot resolve
        against a zero-height box: url(#wire) painted absolutely nothing on it,
        leaving only the static grey copy underneath and no visible flow. Same
        two colours, declared in user space along the line's own coordinates. -->
  <linearGradient id="wirex" gradientUnits="userSpaceOnUse"
                  x1="330" y1="356" x2="1210" y2="356">
    <stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#22d3ee"/>
  </linearGradient>
</defs>
<g clip-path="url(#frame)">
  <rect width="1280" height="420" fill="url(#sky)"/>
  <!-- two slow auroras, so the panel is never quite still -->
  <ellipse cx="300" cy="90" rx="520" ry="240" fill="url(#glowA)">
    <animate attributeName="cx" values="240;420;240" dur="19s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".75;1;.75" dur="9s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="1030" cy="360" rx="480" ry="230" fill="url(#glowB)">
    <animate attributeName="cx" values="1080;900;1080" dur="23s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;.7;1" dur="11s" repeatCount="indefinite"/>
  </ellipse>
  <!-- a faint grid, to read as an instrument panel rather than a poster -->
  <g stroke="#ffffff" stroke-opacity=".04">
    <path d="M0 60H1280M0 120H1280M0 180H1280M0 240H1280M0 300H1280M0 360H1280"/>
    <path d="M80 0V420M240 0V420M400 0V420M560 0V420M720 0V420M880 0V420M1040 0V420M1200 0V420"/>
  </g>

  <!-- ── the globe: meridians whose rx sweeps to 0 and back, which is what
       a rotating wireframe sphere looks like from a fixed camera ── -->
  <g transform="translate(168 196)">
    <circle r="92" fill="#0e1222" stroke="#2a2144" stroke-width="1.5"/>
    <circle r="92" fill="none" stroke="url(#wire)" stroke-width="2" stroke-opacity=".55"/>
    <g fill="none" stroke="url(#wire)" stroke-width="1.4" stroke-opacity=".75">
      <ellipse rx="92" ry="92"><animate attributeName="rx" values="92;0;92" dur="12s"
        begin="0s" repeatCount="indefinite"/></ellipse>
      <ellipse rx="61" ry="92"><animate attributeName="rx" values="61;0;92;61" dur="12s"
        begin="-2s" repeatCount="indefinite"/></ellipse>
      <ellipse rx="31" ry="92"><animate attributeName="rx" values="31;0;92;31" dur="12s"
        begin="-4s" repeatCount="indefinite"/></ellipse>
      <ellipse rx="76" ry="92"><animate attributeName="rx" values="76;0;92;76" dur="12s"
        begin="-7s" repeatCount="indefinite"/></ellipse>
    </g>
    <g fill="none" stroke="#8b5cf6" stroke-width="1.1" stroke-opacity=".45">
      <ellipse rx="92" ry="30"/><ellipse rx="80" ry="58"/><ellipse rx="52" ry="80"/>
    </g>
    <!-- exit markers: three countries lighting in turn, never all at once,
         because the app connects to one exit country at a time -->
    <g fill="#22c55e">
      <circle cx="-38" cy="-34" r="5"><animate attributeName="opacity"
        values="0;1;1;0;0;0" dur="9s" repeatCount="indefinite"/></circle>
      <circle cx="46" cy="18" r="5"><animate attributeName="opacity"
        values="0;0;0;1;1;0" dur="9s" repeatCount="indefinite"/></circle>
      <circle cx="10" cy="-62" r="5"><animate attributeName="opacity"
        values="1;0;0;0;0;1" dur="9s" repeatCount="indefinite"/></circle>
    </g>
  </g>
  <!-- ── wordmark ── the sweep is a second copy of the same glyphs painted
       with a gradient that is transparent except for one moving band ── -->
  <g transform="translate(312 0)">
    <text y="150" font-size="70" font-weight="700" letter-spacing="-1.5"
          fill="url(#brand)">FreeProxy VPN</text>
    <text y="150" font-size="70" font-weight="700" letter-spacing="-1.5"
          fill="url(#shine)">FreeProxy VPN</text>
    <rect y="170" width="470" height="3" rx="1.5" fill="url(#brand)" opacity=".7">
      <animate attributeName="width" values="0;470" dur="1.1s" fill="freeze"/>
    </rect>
    <text y="212" font-size="23" fill="#dbe2f0">Tor-powered privacy for Windows, with the
      <tspan fill="#a78bfa" font-weight="600">exit country you actually chose</tspan>.</text>
    <text y="248" font-size="18" fill="#93a2bd">Real geolocation spoofing in 14 browsers.
      DNS and IPv6 leak protection. A kill switch that blocks.</text>
    <g font-size="15.5" fill="#7d8aa5" letter-spacing=".3">
      <text y="292">no account  &#183;  no subscription  &#183;  no telemetry  &#183;  no logs kept  &#183;
        74 exit countries  &#183;  MIT licensed</text>
    </g>
  </g>

  <!-- ── the circuit, drawn as what it is: three relays, and only the last
       one is the country you pick ── -->
  <g>
    <use href="#hop" stroke="#2c2547" stroke-width="2.5"/>
    <use href="#hop" stroke="url(#wirex)" stroke-width="2.5" stroke-opacity=".8"
         stroke-dasharray="10 12">
      <animate attributeName="stroke-dashoffset" values="44;0" dur="1.6s" repeatCount="indefinite"/>
    </use>
    <!-- three packets, spaced, so the line reads as flowing one way -->
    <g fill="#e879f9">
      <circle r="5"><animateMotion path="M330 356 H1210" dur="4.2s" repeatCount="indefinite"/></circle>
      <circle r="4" fill="#22d3ee"><animateMotion path="M330 356 H1210" dur="4.2s"
        begin="-1.4s" repeatCount="indefinite"/></circle>
      <circle r="3.4" fill="#a78bfa"><animateMotion path="M330 356 H1210" dur="4.2s"
        begin="-2.8s" repeatCount="indefinite"/></circle>
    </g>
    <g font-size="13.5" fill="#8896b0" text-anchor="middle">
      <g fill="#0b0d17" stroke="url(#wire)" stroke-width="2">
        <circle cx="330" cy="356" r="9"/><circle cx="550" cy="356" r="7"/>
        <circle cx="770" cy="356" r="7"/><circle cx="1210" cy="356" r="9"/>
      </g>
      <circle cx="990" cy="356" r="10" fill="#0b0d17" stroke="#22c55e" stroke-width="2.5">
        <animate attributeName="r" values="10;13;10" dur="2.6s" repeatCount="indefinite"/>
      </circle>
      <text x="330" y="388">your PC</text><text x="550" y="388">entry guard</text>
      <text x="770" y="388">middle relay</text>
      <text x="990" y="388" fill="#22c55e" font-weight="600">exit &#183; your country</text>
      <text x="1210" y="388" text-anchor="end">the site</text>
    </g>
  </g>

</g>

</svg>
