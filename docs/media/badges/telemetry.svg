<svg xmlns="http://www.w3.org/2000/svg" width="112" height="22" role="img"
     viewBox="0 0 112 22" aria-label="telemetry: none">
  <title>telemetry: none</title>
  <defs>
    <linearGradient id="gcdloxd" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".16"/>
      <stop offset="1" stop-color="#000" stop-opacity=".16"/>
    </linearGradient>
    <clipPath id="cgcdloxd"><rect width="112" height="22" rx="4"/></clipPath>
  </defs>
  <g clip-path="url(#cgcdloxd)">
    <rect width="68" height="22" fill="#161a27"/>
    <rect x="68" width="44" height="22" fill="#15803d"/>
    <rect width="112" height="22" fill="url(#gcdloxd)"/>
    <rect x="68" width="44" height="22" fill="#fff" opacity="0">
      <animate attributeName="opacity" values="0;.28;0" dur="2.4s"
               begin="1.04s" repeatCount="1" fill="freeze"/>
    </rect>
  </g>
  <g font-family="'Segoe UI',Verdana,DejaVu Sans,sans-serif" font-size="11">
    <text x="34" y="15" fill="#000" fill-opacity=".45" text-anchor="middle"
          textLength="50" lengthAdjust="spacingAndGlyphs">telemetry</text>
    <text x="34" y="14" fill="#c7cede" text-anchor="middle"
          textLength="50" lengthAdjust="spacingAndGlyphs">telemetry</text>
    <text x="90" y="15" fill="#000" fill-opacity=".35" text-anchor="middle"
          textLength="26" lengthAdjust="spacingAndGlyphs">none</text>
    <text x="90" y="14" fill="#fff" text-anchor="middle" font-weight="600"
          textLength="26" lengthAdjust="spacingAndGlyphs">none</text>
  </g>
</svg>
